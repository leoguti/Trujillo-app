"origin": "8f8f53ae20a36c6", "destination": "8f8f53ac1d0c699"}];

const RESOLUTION = 9;

const map = L.map('map', { zoomControl: true }).setView([-8.112, -79.028], 13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

const originCounts = {};
const flowMap = {};

for (const pair of PAIRS_RAW) {
  try {
    const orig9 = h3.cellToParent(pair.origin, RESOLUTION);
    const dest9 = h3.cellToParent(pair.destination, RESOLUTION);
    if (orig9 === dest9) continue;
    originCounts[orig9] = (originCounts[orig9] || 0) + 1;
    if (!flowMap[orig9]) flowMap[orig9] = {};
    flowMap[orig9][dest9] = (flowMap[orig9][dest9] || 0) + 1;
  } catch(e) {}
}

function getColor(n) {
  if (n >= 31) return '#e31a1c';
  if (n >= 16) return '#fd8d3c';
  if (n >= 6)  return '#fecc5c';
  return '#ffffb2';
}

const hexLayers = {};
const curveLayer = L.layerGroup().addTo(map);

for (const [h3idx, count] of Object.entries(originCounts)) {
  try {
    const boundary = h3.cellToBoundary(h3idx);
    const latLngs = boundary.map(([lat, lng]) => [lat, lng]);
    latLngs.push(latLngs[0]);
    const poly = L.polygon(latLngs, {
      color: '#fff', weight: 0.5, opacity: 0.4,
      fillColor: getColor(count), fillOpacity: 0.65
    }).addTo(map);
    poly.on('click', () => showFlows(h3idx, count));
    hexLayers[h3idx] = poly;
  } catch(e) {}
}

function bezierPoints(p1, p2, steps = 40) {
  const midLat = (p1[0] + p2[0]) / 2;
  const midLng = (p1[1] + p2[1]) / 2;
  const dx = p2[1] - p1[1];
  const dy = p2[0] - p1[0];
  const ctrl = [midLat - dx * 0.3, midLng + dy * 0.3];
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const lat = (1-t)*(1-t)*p1[0] + 2*(1-t)*t*ctrl[0] + t*t*p2[0];
    const lng = (1-t)*(1-t)*p1[1] + 2*(1-t)*t*ctrl[1] + t*t*p2[1];
    pts.push([lat, lng]);
  }
  return pts;
}

function showFlows(orig9, count) {
  curveLayer.clearLayers();
  for (const layer of Object.values(hexLayers)) {
    layer.setStyle({ fillOpacity: 0.65, weight: 0.5, color: '#fff' });
  }
  if (hexLayers[orig9]) {
    hexLayers[orig9].setStyle({ fillOpacity: 0.9, weight: 2, color: '#fff' });
  }
  const [origLat, origLng] = h3.cellToLatLng(orig9);
  const flows = flowMap[orig9] || {};
  const sorted = Object.entries(flows).sort((a, b) => b[1] - a[1]);
  const maxFlow = sorted[0] ? sorted[0][1] : 1;

  for (const [dest9, cnt] of sorted) {
    try {
      const [destLat, destLng] = h3.cellToLatLng(dest9);
      const pts = bezierPoints([origLat, origLng], [destLat, destLng]);
      const w = 1 + (cnt / maxFlow) * 4;
      const op = 0.3 + (cnt / maxFlow) * 0.6;
      L.polyline(pts, { color: '#00cfff', weight: w, opacity: op }).addTo(curveLayer);
      L.circleMarker([destLat, destLng], {
        radius: 4, color: '#00cfff', fillColor: '#00cfff', fillOpacity: 0.8, weight: 0
      }).addTo(curveLayer).bindTooltip(`${cnt} viaje${cnt > 1 ? 's' : ''}`);
    } catch(e) {}
  }

  let html = `<b>Zona origen:</b> ...${orig9.slice(-6)}<br>`;
  html += `<b>Viajes desde aqui:</b> ${count}<br>`;
  html += `<b>Destinos distintos:</b> ${sorted.length}<br><br>`;
  for (const [dest9, cnt] of sorted.slice(0, 8)) {
    html += `→ ...${dest9.slice(-6)}: <b>${cnt}</b> viaje${cnt > 1 ? 's' : ''}<br>`;
  }
  document.getElementById('info').innerHTML = html;
}

const total = PAIRS_RAW.length;
const nOrigins = Object.keys(originCounts).length;
document.getElementById('info').innerHTML =
  `<b>${total}</b> registros reales<br><b>${nOrigins}</b> zonas con origen<br><br>Haz clic en un hexagono`;
