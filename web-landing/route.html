<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruta compartida — Trujillo MiRuta</title>
  <meta name="description" content="Alguien te compartió una ruta de transporte público en Trujillo. Descarga MiRuta para verla." />
  <link rel="icon" href="app-logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .route-page{
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:2rem;text-align:center;
      background:linear-gradient(160deg,var(--crema) 0%,var(--blanco) 60%);
    }
    .route-card{
      background:var(--blanco);border-radius:var(--radius);
      box-shadow:0 12px 40px rgba(15,30,51,.1);
      padding:2.5rem 2rem;max-width:440px;width:100%;
    }
    .route-card .logo{height:56px;border-radius:12px;margin-bottom:1.25rem}
    .route-card h1{font-size:1.5rem;margin-bottom:0.5rem;color:var(--azul-profundo)}
    .route-card .desc{color:var(--texto-suave);line-height:1.6;margin-bottom:1.5rem}
    .route-info{
      background:var(--crema);border-radius:12px;padding:1rem 1.25rem;
      margin-bottom:1.5rem;text-align:left;
    }
    .route-info .label{font-size:.8rem;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
    .route-info .value{font-weight:700;color:var(--azul-profundo);margin-bottom:.5rem}
    .route-info .value:last-child{margin-bottom:0}
    .open-btn{
      display:inline-block;
      padding:.75rem 2rem;border-radius:999px;
      background:var(--azul-primario);color:var(--blanco);
      text-decoration:none;font-weight:700;font-size:1rem;
      transition:background .2s;margin-bottom:1rem;
    }
    .open-btn:hover{background:var(--azul-profundo)}
    .route-page .store-buttons{margin-top:0.5rem}
    .divider{color:var(--texto-suave);font-size:.85rem;margin:1rem 0 0.5rem}
  </style>
</head>
<body>
  <div class="route-page">
    <div class="route-card">
      <img src="app-logo.png" alt="MiRuta" class="logo" />
      <h1>Ruta compartida</h1>
      <p class="desc">Alguien te compartió una ruta de transporte público en Trujillo.</p>

      <div class="route-info" id="routeInfo" style="display:none">
        <div class="label">Origen</div>
        <div class="value" id="fromName">—</div>
        <div class="label">Destino</div>
        <div class="value" id="toName">—</div>
      </div>

      <a id="deepLink" class="open-btn" href="#">Abrir en MiRuta</a>

      <p class="divider">¿No tienes la app? Descárgala gratis:</p>

      <div class="store-buttons" style="justify-content:center">
        <a href="#" class="store-btn android" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3.18 23.54c-.36-.17-.56-.51-.56-.92V1.38c0-.41.2-.75.57-.92l10.62 11.54L3.18 23.54zM14.97 13.12l2.76 2.76-12.11 6.89 9.35-9.65zM19.44 10.79l-2.65 1.51-2.94-3.2 2.94-3.2 2.65 1.51c.89.51 1.34 1.15 1.34 1.69s-.45 1.18-1.34 1.69zM5.62.92l12.11 6.89-2.76 2.76L5.62.92z"/></svg>
          <div>
            <span class="store-label">Descargar en</span>
            <span class="store-name">Google Play</span>
          </div>
        </a>
        <a href="#" class="store-btn ios" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          <div>
            <span class="store-label">Descargar en</span>
            <span class="store-name">App Store</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Parse URL params and show route info
    const params = new URLSearchParams(window.location.search);
    const fromName = params.get('fromName');
    const toName = params.get('toName');

    if (fromName || toName) {
      document.getElementById('routeInfo').style.display = 'block';
      if (fromName) document.getElementById('fromName').textContent = fromName;
      if (toName) document.getElementById('toName').textContent = toName;
    }

    // Build deep link for the app
    const deepLinkUrl = 'trujillomiruta://route' + window.location.search;
    document.getElementById('deepLink').href = deepLinkUrl;

    // Try to open the app automatically
    window.location.href = deepLinkUrl;
  </script>
</body>
</html>
