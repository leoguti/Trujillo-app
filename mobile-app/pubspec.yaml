name: trujillo_mobility
description: "Trujillo MiRuta - Public transport app for Trujillo, Peru"
publish_to: 'none'
version: 1.4.0+11

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.0
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1
  go_router: ^17.0.1
  latlong2: ^0.9.1
  h3_flutter: ^0.7.1
  maplibre_gl: ^0.25.0
  # Trufi Core packages from git
  trufi_core_interfaces:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_interfaces

  trufi_core_ui:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_ui

  trufi_core_utils:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_utils

  trufi_core_maps:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_maps

  trufi_core_navigation:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_navigation

  trufi_core_routing:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_routing

  trufi_core_search_locations:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_search_locations

  trufi_core_poi_layers:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_poi_layers

  # Screen packages
  trufi_core_home_screen:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_home_screen

  trufi_core_saved_places:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_saved_places

  trufi_core_transport_list:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_transport_list

  trufi_core_fares:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_fares

  trufi_core_feedback:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_feedback

  trufi_core_settings:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_settings

  trufi_core_about:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_about

dependency_overrides:
  # maplibre_gl 0.25.0 crashes on iOS with SIGABRT (std::domain_error from
  # mbgl::LatLng) whenever a camera operation reaches a map whose native
  # frame is still zero-sized — exactly what happens when the route detail
  # screen creates its map and fits the camera to the route. Fixed upstream
  # in 0.26.2 (maplibre/flutter-maplibre-gl#819, fix #841), but trufi_core
  # v5.14.3 pins ^0.25.0, so the fixed version has to be forced here.
  maplibre_gl: 0.26.2
  # All trufi_core packages forced to the git tag so both direct deps and
  # transitive ones (e.g. trufi_core_routing_ui → trufi_core_routing) resolve
  # to the same git source instead of pub.dev. Needed until the packages are
  # published to pub.dev.
  trufi_core_interfaces:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_interfaces
  trufi_core_ui:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_ui
  trufi_core_utils:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_utils
  trufi_core_maps:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_maps
  trufi_core_navigation:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_navigation
  trufi_core_routing:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_routing
  trufi_core_search_locations:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_search_locations
  trufi_core_poi_layers:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_poi_layers
  trufi_core_home_screen:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_home_screen
  trufi_core_saved_places:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_saved_places
  trufi_core_transport_list:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_transport_list
  trufi_core_fares:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_fares
  trufi_core_feedback:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_feedback
  trufi_core_settings:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_settings
  trufi_core_about:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/screens/trufi_core_about
  trufi_core_base_widgets:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_base_widgets
  trufi_core_custom_material:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_custom_material
  trufi_core_planner:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_planner
  trufi_core_routing_ui:
    git:
      url: https://github.com/trufi-association/trufi-core.git
      ref: v5.14.3
      path: packages/trufi_core_routing_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    # POI Layers assets
    - assets/pois/
    # Offline maps assets
    - assets/offline/
    - assets/offline/styles/osm-bright/
    - assets/offline/styles/osm-liberty/
    - assets/offline/styles/dark-matter/
    - assets/offline/styles/fiord-color/
    - assets/offline/fonts/OpenSansRegular/
    - assets/offline/fonts/OpenSansBold/
    - assets/offline/fonts/OpenSansItalic/
    - assets/offline/fonts/RobotoRegular/
    - assets/offline/fonts/RobotoMedium/
    - assets/offline/fonts/RobotoCondensedItalic/
    - assets/offline/fonts/MetropolisLight/
    - assets/offline/fonts/MetropolisLightItalic/
    - assets/offline/fonts/MetropolisRegular/
    - assets/offline/fonts/MetropolisMediumItalic/
    - assets/offline/fonts/NotoSansRegular/
    - assets/offline/fonts/NotoSansItalic/
    # Geo data (district boundaries)
    - assets/geo/
    # Branding (partner logos)
    - assets/branding/
